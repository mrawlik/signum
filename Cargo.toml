[package]
name = "signum"
version = "0.1.2"
edition = "2024"
description = "Stamp an SVG signature and a date onto PDFs"
repository = "https://github.com/mrawlik/signum"
license = "MIT OR Apache-2.0"

[dependencies]
# glow, not the default wgpu: wgpu probes every Vulkan GPU, which wakes a sleeping
# discrete GPU on hybrid laptops and delays startup by seconds.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "persistence",
    "system_fonts",
    "wayland",
    "x11",
] }
hayro = "0.8.0"
jiff = "0.2.38"
kurbo = "0.13"
lopdf = { version = "0.46.0", default-features = false }
pdf-writer = "0.12"
resvg = { version = "0.45", default-features = false, features = ["text"] }
rfd = "0.17"
svg2pdf = { version = "0.13.0", default-features = false, features = ["text"] }
winit = { version = "0.30", default-features = false }

# hayro is ~100x slower unoptimised; keep dependencies fast in debug builds.
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "Michał Rawlik <dev@mrawlik.com>"
section = "graphics"
depends = "$auto"
# rfd opens file dialogs through the desktop portal.
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/signum", "usr/bin/", "755"],
    ["packaging/linux/io.github.mrawlik.signum.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.mrawlik.signum.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/linux/icons/16.png", "usr/share/icons/hicolor/16x16/apps/io.github.mrawlik.signum.png", "644"],
    ["packaging/linux/icons/32.png", "usr/share/icons/hicolor/32x32/apps/io.github.mrawlik.signum.png", "644"],
    ["packaging/linux/icons/48.png", "usr/share/icons/hicolor/48x48/apps/io.github.mrawlik.signum.png", "644"],
    ["packaging/linux/icons/128.png", "usr/share/icons/hicolor/128x128/apps/io.github.mrawlik.signum.png", "644"],
    ["packaging/linux/icons/256.png", "usr/share/icons/hicolor/256x256/apps/io.github.mrawlik.signum.png", "644"],
    ["LICENSE-MIT", "usr/share/doc/signum/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/signum/", "644"],
    ["assets/DejaVuSans-LICENSE.txt", "usr/share/doc/signum/DejaVuSans-LICENSE.txt", "644"],
]
